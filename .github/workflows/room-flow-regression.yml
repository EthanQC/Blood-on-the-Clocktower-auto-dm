name: Room Flow Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  room-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show tool versions
        run: |
          docker --version
          docker compose version
          go version
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend regression tests
        working-directory: backend
        run: go test ./internal/bot ./internal/engine

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint-ci

      - name: Run room flow browser regression
        working-directory: frontend
        env:
          CI: "1"
        run: npm run e2e:room-flow

      - name: Upload room flow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-flow-artifacts
          path: tmp/e2e-room-flow
          if-no-files-found: ignore
